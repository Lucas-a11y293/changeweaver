name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest --cov=changeweaver --cov-report=term-missing
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src

  sarif:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install .
      - name: Analyze fixture contract
        run: |
          changeweaver check --root tests/fixtures/sample_app --sarif > changeweaver.sarif || test $? -eq 1
      - name: Create verification receipt
        run: |
          changeweaver verify \
            --root tests/fixtures/sample_app \
            --target lib/domain/user.dart \
            --output changeweaver-receipt.json \
            --json || test $? -eq 1
      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: changeweaver-verification-receipt
          path: changeweaver-receipt.json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: changeweaver.sarif
