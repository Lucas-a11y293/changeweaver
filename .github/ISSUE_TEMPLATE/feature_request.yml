name: Feature request
description: Propose a focused improvement to ChangeWeaver.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or CI problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its output contract.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and boundaries
      description: Explain why existing Flutter/Dart tooling does not already solve it.
